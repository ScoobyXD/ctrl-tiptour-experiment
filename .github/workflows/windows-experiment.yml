name: Windows browser experiment
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows-browser
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync --locked --python 3.12
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File scripts/Debug-CTRL.ps1 -VerifyOnly
      - run: powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File scripts/Test-ControlPanel.ps1
      - run: uv build
